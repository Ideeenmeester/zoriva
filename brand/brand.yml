  magenta: "#9B4A9E"          # einde van het verloop
  accent: "#E9A6F1"           # uitgelichte woorden op donker
  lavendel: "#F1ECF4"         # lichte vlakken en kaarten
  pil: "#EEE6F2"              # lichte labels
  rand: "#E6DAEA"             # dunne kaartranden
  wit: "#FFFFFF"              # achtergrond van het logobestand, dus ook van de logobalk
aanspreekvorm: je             # je/jij/jouw; "u" en "uw" worden door de controle afgekeurd
prijzen:
