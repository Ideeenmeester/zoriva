# Huisstijl Zoriva Zorg. Pas hier kleuren, url of kernwoorden aan; alle beelden en controles volgen vanzelf.
naam: Zoriva
url: zoriva.nl
logo: brand/logo.png          # origineel logobestand, wordt NOOIT aangepast
logo_sha256: 748759ea10364e093c5c57b52730ecb015fcbcc83c67cf5c4ce584307058868a   # controle faalt als het logo wijzigt
kleuren:
  diep: "#35123C"             # donkerste paars, start van het verloop
