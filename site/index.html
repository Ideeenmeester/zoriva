<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoriva LinkedIn-planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--diep:#35123C;--paars:#63256C;--magenta:#9B4A9E;--accent:#E9A6F1;--lavendel:#F1ECF4;--pil:#EEE6F2;--rand:#E6DAEA}
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--lavendel);color:var(--diep)}
header{background:linear-gradient(115deg,var(--diep),#6A2873 70%,var(--magenta));color:#fff;padding:36px 16px 30px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header img{height:44px;background:#fff;padding:6px 12px;border-radius:10px}
h1{font-size:clamp(26px,4vw,40px);letter-spacing:-.02em;margin-top:18px}
header p{opacity:.85;margin-top:6px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 6px}
select{font:inherit;font-size:15px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--rand);background:#fff;color:var(--paars)}
.teller{font-size:14px;color:#6B5672;margin:6px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;padding-bottom:60px}
.post{background:#fff;border:1.5px solid var(--rand);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.post img{width:100%;display:block;aspect-ratio:1200/627;object-fit:cover;background:var(--pil)}
.meta{display:flex;flex-wrap:wrap;gap:8px;padding:16px 18px 0;font-size:13px}
.pil{background:var(--pil);color:var(--paars);padding:4px 12px;border-radius:999px}
.pil.r-risico{background:var(--diep);color:#fff}.pil.r-advertentie{background:var(--magenta);color:#fff}
h2{font-size:18px;padding:10px 18px 0;letter-spacing:-.01em}
.tekst{white-space:pre-wrap;font-size:14px;line-height:1.55;color:#4A3A50;padding:10px 18px;flex:1}
.knoppen{display:flex;gap:8px;padding:0 18px 18px}
button,a.knop{font:inherit;font-size:14px;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;text-decoration:none}
button{background:var(--paars);color:#fff}a.knop{background:var(--pil);color:var(--paars)}
@media(max-width:400px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap"><img src="logo.png" alt="Zoriva"><h1>LinkedIn-planning</h1><p>Alle posts met beeld, datum en tijd (Europe/Amsterdam). Bijgewerkt 29 oktober 2026 om 22:53.</p></div></header>
<main class="wrap">
<div class="filters"><select id="maand"><option value="">Alle maanden</option></select>
<select id="reeks"><option value="">Alle reeksen</option><option value="risico">Risico (ma-wo-vr)</option><option value="gerust">Geruststellend (di-do)</option><option value="advertentie">Advertenties</option></select>
<select id="doel"><option value="">Alle doelgroepen</option><option value="opdrachtgevers">Opdrachtgevers</option><option value="zelfstandigen">Zelfstandigen</option><option value="sector">Sector</option><option value="beide">Beide</option></select></div>
<div class="teller" id="teller"></div><div class="grid" id="grid"></div></main>
<script>
const POSTS=[{"id":"01-wtta-twee-data","nr":1,"datum":"2026-11-02","tijd":"08:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Twee Wtta-data voor iedereen die inleent","tekst":"Weet jij zeker dat het bureau waar je mensen van inleent na de jaarwisseling nog mag uitlenen? Op 1 januari 2027 gaat de Wtta in en mogen alleen uitleners met een toelating nog arbeidskrachten ter beschikking stellen, en vanaf 1 januari 2028 controleert de Arbeidsinspectie ook bij de organisaties die inlenen, want ook zij kunnen een boete krijgen als hun uitlener die toelating mist. Je betaalt een bureau dus elk uur een marge en houdt het risico toch zelf, en daarom kijken steeds meer organisaties naar een route waarin je rechtstreeks een opdracht geeft aan een zelfstandige die zonder gezag werkt, alles goed vastlegt en zo niet afhangt van de toelating van een ander.\n\nBekijk onze website.","beeld":"beelden/01-wtta-twee-data.png"},{"id":"02-nul-euro-marge","nr":2,"datum":"2026-11-03","tijd":"10:00","reeks":"gerust","doelgroep":"opdrachtgevers","onderwerp":"Wat de professional factureert, betaal jij","tekst":"Het bedrag op de factuur van de zelfstandige is bij Zoriva precies het bedrag dat jij betaalt, omdat er niemand tussen zit die per gewerkt uur een opslag rekent. Jij en de professional spreken samen het tarief, de periode en de werkwijze af, de professional factureert dat tarief rechtstreeks aan jou en voor de software betaal je een vaste prijs die niet meegroeit met elk extra uur. Zo blijft het geld dat bedoeld is voor zorg ook echt bij de mensen die die zorg leveren, en weet je als organisatie vooraf waar je aan toe bent zonder afhankelijk te worden van een partij die belang heeft bij meer uren.\n\nBekijk onze website.","beeld":"beelden/02-nul-euro-marge.png"},{"id":"03-alleen-via-bureau","nr":3,"datum":"2026-11-04","tijd":"09:00","reeks":"risico","doelgroep":"zelfstandigen","onderwerp":"Alleen nog via een bureau mogen werken","tekst":"Hoor jij ook steeds vaker dat je alleen nog via een bureau aan de slag mag? Na alle onrust rond de Wet DBA durven veel opdrachtgevers geen zelfstandige meer rechtstreeks in te huren, waardoor jij een deel van je tarief inlevert aan een partij die het werk niet doet en vaak ook de vrijheid kwijtraakt om zelf afspraken te maken over periode en werkwijze. Ondertussen draait de vraag of je echt zelfstandig werkt nog altijd om hoe de samenwerking in de praktijk verloopt, en daar verandert een tussenpartij weinig aan. Wat je opdrachtgever wel zekerheid geeft, is een helder afgebakende opdracht en een dossier waarin staat hoe jullie samen hebben gewerkt, rechtstreeks en zonder dat iemand aan jouw uren verdient.\n\nBekijk onze website.","beeld":"beelden/03-alleen-via-bureau.png"},{"id":"04-onderwijs-sinds-2018","nr":4,"datum":"2026-11-05","tijd":"11:00","reeks":"gerust","doelgroep":"sector","onderwerp":"In het onderwijs is het al gelukt","tekst":"Wat in de zorg nog nieuw klinkt, doen scholen en zelfstandige docenten al sinds 2018, want bij Flexonderwijs werken zij rechtstreeks met elkaar samen zonder bureau dat aan elk lesuur verdient. Wat daar in bijna negen jaar is geleerd over het afbakenen van opdrachten, het bijhouden van een dossier en het eerlijk tot stand komen van tarieven, vormt nu de basis van Zoriva, zodat ook zorgorganisaties en andere sectoren hun eigen flexibele schil met dezelfde rust kunnen organiseren. Je stapt daarmee in een werkwijze die zich in de praktijk heeft bewezen en die jaar na jaar is aangescherpt op basis van wat opdrachtgevers en zelfstandigen er zelf van vonden.\n\nBekijk onze website.","beeld":"beelden/04-onderwijs-sinds-2018.png"},{"id":"05-wat-je-niet-meer-betaalt","nr":5,"datum":"2026-11-06","tijd":"10:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"De marge die elk jaar meegroeit","tekst":"Een opslag van een paar euro per uur lijkt weinig, totdat je hem vermenigvuldigt met alle diensten die zelfstandigen in een jaar bij jouw organisatie draaien. Je betaalt dan structureel voor een schakel die het werk zelf niet beter maakt, vaak ook voor professionals die je al jaren kent en die je net zo goed zelf had kunnen vragen. Met Zoriva spreek je het tarief rechtstreeks af met de professional, die precies factureert wat jullie samen hebben afgesproken, terwijl je zelf alleen een vaste prijs voor de software betaalt die gelijk blijft als er meer uren worden gewerkt, zonder fee per plaatsing en zonder overnamekosten wanneer iemand bij je in dienst wil.\n\nBekijk onze website.","beeld":"beelden/05-wat-je-niet-meer-betaalt.png"},{"id":"06-handhaving-sinds-2025","nr":6,"datum":"2026-11-09","tijd":"11:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Handhaving op schijnzelfstandigheid is terug","tekst":"De tijd dat de Belastingdienst bij schijnzelfstandigheid alleen een waarschuwing gaf, ligt al bijna twee jaar achter ons. Sinds 1 januari 2025 wordt weer volledig gehandhaafd en sinds 1 januari 2026 kunnen daarbij ook vergrijpboetes worden opgelegd, terwijl de opdrachtgever alsnog loonheffingen moet afdragen als een samenwerking in de praktijk een dienstverband blijkt te zijn. Hoe het werk feitelijk verloopt op jouw werkvloer bepaal je zelf, met of zonder bureau ertussen, en daarom bouw je zekerheid het best op door helder af te spreken wat de opdracht is en vast te leggen hoe die is uitgevoerd, zodat je het verhaal achter elke samenwerking kunt laten zien zodra iemand ernaar vraagt.\n\nBekijk onze website.","beeld":"beelden/06-handhaving-sinds-2025.png"},{"id":"07-jij-houdt-alles","nr":7,"datum":"2026-11-10","tijd":"12:00","reeks":"gerust","doelgroep":"zelfstandigen","onderwerp":"Jij onderhandelt, jij factureert, jij houdt alles","tekst":"Jij onderhandelt, jij factureert en jij houdt alles wat je verdient, en zo hoort zelfstandig werken eigenlijk ook te voelen. Op Zoriva maak je rechtstreeks afspraken met de opdrachtgever over tarief, periode en werkwijze, en stuur je zelf de factuur voor precies het bedrag dat jullie hebben afgesproken, omdat er geen bemiddelaar is die een percentage van je uren vraagt. Je opdrachten, uren en facturen staan op één plek, terwijl je opdrachtgever tegelijk een helder dossier ziet, zodat jullie allebei kunnen laten zien dat de samenwerking klopt en jij je ondernemerschap in de praktijk ook echt waarmaakt.\n\nBekijk onze website.","beeld":"beelden/07-jij-houdt-alles.png"},{"id":"08-wie-bepaalt-jouw-tarief","nr":8,"datum":"2026-11-11","tijd":"12:00","reeks":"risico","doelgroep":"zelfstandigen","onderwerp":"Een tarief dat een ander bepaalt","tekst":"Laat jij je uurtarief nog door een tussenpartij bepalen? Wie het tarief van een zelfstandige vaststelt, is een van de dingen waar naar wordt gekeken bij de vraag of iemand echt als ondernemer werkt, en een tarief dat door een derde wordt bepaald, wijst eerder richting gezag dan richting zelfstandigheid. Toch is het in veel bureauconstructies de tussenpartij die vooraf vastlegt wat je per uur krijgt, wat er bovenop gaat en hoe lang de opdracht loopt, waardoor je ondernemerschap onder druk komt op precies het punt dat ertoe doet. Bij Zoriva komt het tarief rechtstreeks tot stand tussen jou en je opdrachtgever, zonder tarieftabellen en zonder minimum of maximum, zodat de afspraak ook echt van jullie samen is.\n\nBekijk onze website.","beeld":"beelden/08-wie-bepaalt-jouw-tarief.png"},{"id":"09-samen-organiseren","nr":9,"datum":"2026-11-12","tijd":"13:00","reeks":"gerust","doelgroep":"sector","onderwerp":"Samen organiseren is slimmer dan alleen","tekst":"Je kunt de tussenpartij er als organisatie prima zelf uit halen, maar het wordt pas echt slim als je dat samen doet met andere locaties of zorgaanbieders in je regio. Door één gezamenlijke pool van zelfstandigen op te bouwen, delen jullie een netwerk van professionals die jullie werkwijze al kennen, terwijl elke organisatie haar eigen opdrachten uitzet en elke zelfstandige zelf blijft kiezen waar hij aan de slag gaat. Zo hoeft niemand ieder voor zich het wiel opnieuw uit te vinden, houden jullie samen het overzicht en blijft het geld dat anders als marge zou verdwijnen gewoon in de sector.\n\nBekijk onze website.","beeld":"beelden/09-samen-organiseren.png"},{"id":"10-btw-over-vrijgestelde-zorg","nr":10,"datum":"2026-11-13","tijd":"13:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Btw over zorg die vrijgesteld had kunnen zijn","tekst":"Betaal jij als zorgorganisatie btw over zorg die eigenlijk vrijgesteld had kunnen zijn? Een zelfstandige zorgprofessional met een BIG-registratie die zorg verleent binnen zijn eigen deskundigheid, valt in de regel onder de medische btw-vrijstelling, maar komt dezelfde professional via uitzenden of detachering bij jou terecht, dan is dat werk volgens de Belastingdienst in principe belast. Die btw kun je als zorgorganisatie meestal niet verrekenen, zodat je naast de marge van de tussenpartij ook nog eens btw betaalt over een tarief dat rechtstreeks vrijgesteld had kunnen zijn. Wie de professional rechtstreeks een opdracht geeft, houdt de vrijstelling in stand waar die geldt, en dat scheelt in de zorg vaak meer dan je op het eerste gezicht zou denken.\n\nBekijk onze website.","beeld":"beelden/10-btw-over-vrijgestelde-zorg.png"},{"id":"11-betalen-voor-je-eigen-relatie","nr":11,"datum":"2026-11-16","tijd":"14:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Overnamekosten voor je eigen relatie","tekst":"Je beste zelfstandige wil bij je in dienst komen, en dan stuurt het bureau een rekening. Het is een van de minder zichtbare kosten van werken via een tussenpartij, omdat je die pas tegenkomt op het moment dat een samenwerking juist heel goed loopt, en je betaalt dan voor een relatie die je zelf hebt opgebouwd met iemand die jouw cliënten, jouw collega's en jouw werkwijze allang kent. Bij Zoriva bestaat zo'n overnamefee niet, ook niet bij indiensttreding, omdat de relatie vanaf de eerste dag van jullie samen is en wij alleen de software leveren waarmee je die samenwerking organiseert.\n\nBekijk onze website.","beeld":"beelden/11-betalen-voor-je-eigen-relatie.png"},{"id":"12-dossier-op-het-moment-zelf","nr":12,"datum":"2026-11-17","tijd":"14:00","reeks":"gerust","doelgroep":"opdrachtgevers","onderwerp":"Een dossier dat zich vanzelf opbouwt","tekst":"Stel dat iemand over twee jaar vraagt hoe een samenwerking met een zelfstandige precies verliep, dan wil je niet hoeven zoeken in oude mails en losse bestanden. In Zoriva worden het profiel, de afspraak, de gewerkte uren en de goedkeuringen bijgehouden op het moment dat ze plaatsvinden, waardoor er per opdracht vanzelf een dossier ontstaat dat laat zien wat jullie hebben afgesproken en wat er daadwerkelijk is gebeurd. De overeenkomst zelf blijft tussen jou en de professional, terwijl het bewijs dat het goed geregeld was op één plek klaarligt wanneer de Belastingdienst, de accountant of je eigen bestuur ernaar vraagt.\n\nBekijk onze website.","beeld":"beelden/12-dossier-op-het-moment-zelf.png"},{"id":"13-zelfstandigenwet-komt","nr":13,"datum":"2026-11-18","tijd":"15:00","reeks":"risico","doelgroep":"zelfstandigen","onderwerp":"De Zelfstandigenwet komt eraan","tekst":"Er komt een Zelfstandigenwet die straks niet alleen naar je opdracht kijkt, maar ook naar jou als ondernemer. Het voorstel lag tot eind oktober in internetconsultatie en moet volgens het kabinet in januari 2028 ingaan, met een zelfstandigentoets en een werkrelatietoets die samen een veilige haven moeten bieden aan wie aan beide voldoet en ook zo werkt. Voor jou betekent dat dat het steeds meer gaat om wat je zelf kunt laten zien, zoals je eigen facturen, je inschrijving bij de KvK, je opdrachtgevers en de vrijheid waarmee je het werk indeelt, en veel minder om de vraag of er een bureau tussen jou en je opdrachtgever zit.\n\nBekijk onze website.","beeld":"beelden/13-zelfstandigenwet-komt.png"},{"id":"14-autonomie-en-zekerheid","nr":14,"datum":"2026-11-19","tijd":"15:00","reeks":"gerust","doelgroep":"zelfstandigen","onderwerp":"Autonomie houden en toch zekerheid bieden","tekst":"Je wilt je eigen ondernemer blijven en je opdrachtgever wil zekerheid dat de samenwerking goed geregeld is, en die twee wensen gaan prima samen zonder dat er een tussenpartij aan te pas komt. Op Zoriva staan je KvK-inschrijving, verzekeringen, diploma's en andere documenten vooraf op orde, met vervaldatum, zodat je opdrachtgever direct ziet dat alles klopt voordat je begint. Daarna spreken jullie samen de opdracht en het tarief af en worden je uren en de goedkeuringen vastgelegd, waardoor je opdrachtgever een dossier heeft en jij je autonomie houdt, met je volledige tarief en een relatie die van jullie tweeën is.\n\nBekijk onze website.","beeld":"beelden/14-autonomie-en-zekerheid.png"},{"id":"15-van-wie-is-jouw-netwerk","nr":15,"datum":"2026-11-20","tijd":"16:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Hoe afhankelijk ben je van je bureau","tekst":"Hoeveel van de zelfstandigen die bij jou werken, ken je eigenlijk alleen via het bureau dat hen levert? Veel organisaties ontdekken pas als ze willen overstappen hoe afhankelijk ze zijn geworden, omdat de contactgegevens, de afspraken en soms zelfs de planning bij een andere partij liggen, terwijl het jouw cliënten zijn die op deze mensen rekenen. Met Zoriva begin je juist bij wie je al kent, je nodigt de zelfstandigen uit met wie je nu al samenwerkt en bouwt zo een eigen netwerk op dat van jouw organisatie blijft, wie er ook een opdracht uitvoert en hoe lang die samenwerking ook duurt.\n\nBekijk onze website.","beeld":"beelden/15-van-wie-is-jouw-netwerk.png"},{"id":"16-honderd-procent-tarief","nr":16,"datum":"2026-11-23","tijd":"17:00","reeks":"risico","doelgroep":"zelfstandigen","onderwerp":"Zekerheid bieden zonder tarief in te leveren","tekst":"Elke euro die een tussenpartij aan jouw uur verdient, komt ergens vandaan, en meestal is dat jouw tarief of het budget van je opdrachtgever. Steeds meer zelfstandigen accepteren die afdracht omdat opdrachtgevers na alle ruis rond de Wet DBA en de aangekondigde Zelfstandigenwet zekerheid zoeken, terwijl die zekerheid in werkelijkheid voortkomt uit hoe jullie samenwerken en niet uit wie de factuur doorstuurt. Je kunt die zekerheid ook zelf bieden door rechtstreeks afspraken te maken, je documenten op orde te hebben en samen vast te leggen hoe de opdracht verloopt, zodat je opdrachtgever met een gerust hart met je werkt en jij je volledige tarief behoudt.\n\nBekijk onze website.","beeld":"beelden/16-honderd-procent-tarief.png"},{"id":"17-begin-bij-wie-je-kent","nr":17,"datum":"2026-11-24","tijd":"16:00","reeks":"gerust","doelgroep":"opdrachtgevers","onderwerp":"Begin bij wie je al kent","tekst":"Overstappen naar rechtstreeks samenwerken klinkt als een groot project, maar de eerste stap is verrassend klein, omdat je begint bij de zelfstandigen die je al kent. Je nodigt hen uit in je eigen omgeving, zij maken een profiel aan met hun documenten en vervaldata, en vanaf dat moment kun je opdrachten uitzetten met een heldere scope, periode en voorwaarden. De professional reageert, jullie spreken samen het tarief en de werkwijze af, en uren, goedkeuringen en facturen lopen daarna via één proces, zodat je stap voor stap de tussenpartij overbodig maakt zonder dat de zorg of het werk er last van heeft.\n\nBekijk onze website.","beeld":"beelden/17-begin-bij-wie-je-kent.png"},{"id":"18-wie-toetst-op-jouw-werkvloer","nr":18,"datum":"2026-11-25","tijd":"18:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Een bureau voelt veilig, maar wie toetst","tekst":"Een bureau inhuren voelt veilig, maar wie kijkt er eigenlijk naar hoe de samenwerking op jouw werkvloer verloopt? De Belastingdienst beoordeelt de feitelijke situatie, zoals wie de werktijden bepaalt, hoe iemand in de organisatie is ingebed en hoe het tarief tot stand komt, en die praktijk organiseer je zelf, met of zonder tussenpartij. Het is daarom verstandiger om te investeren in heldere opdrachten en een goed dossier dan in een opslag per uur die vooral een gevoel van zekerheid oplevert, zeker nu er weer volledig wordt gehandhaafd en de regels rond zelfstandigen opnieuw in beweging zijn.\n\nBekijk onze website.","beeld":"beelden/18-wie-toetst-op-jouw-werkvloer.png"},{"id":"19-iedereen-in-een-overzicht","nr":19,"datum":"2026-11-26","tijd":"17:00","reeks":"gerust","doelgroep":"opdrachtgevers","onderwerp":"Iedereen die voor je werkt in één overzicht","tekst":"Weet jij op dit moment hoeveel zelfstandigen er voor jouw organisatie werken, op welke afdelingen en met welke afspraken? In Zoriva zie je in één overzicht iedereen die rechtstreeks voor je werkt, met de lopende opdrachten, de gewerkte uren en de documenten waarvan de vervaldatum nadert, zodat management, HR en planning op hetzelfde beeld sturen. Dat overzicht hoef je niet bij een leverancier op te vragen, omdat het gewoon in je eigen omgeving staat, en het groeit mee met je flexibele schil zonder dat de kosten per gewerkt uur oplopen.\n\nBekijk onze website.","beeld":"beelden/19-iedereen-in-een-overzicht.png"},{"id":"20-papieren-op-orde","nr":20,"datum":"2026-11-27","tijd":"19:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Documenten die ongemerkt verlopen","tekst":"Een verlopen verzekering of een gemiste herregistratie ontdek je liever niet pas nadat iemand al drie diensten heeft gedraaid. Toch gebeurt dat sneller dan je denkt als de documenten van zelfstandigen verspreid staan over mailboxen, portalen van verschillende bureaus en losse mappen, en niemand precies weet wanneer iets afloopt. In Zoriva staan de KvK-inschrijving, verzekeringen, diploma's, BIG-registratie en VOG per persoon vast, met een vervaldatum waar die er is, en wat dreigt te verlopen valt op voordat iemand wordt ingezet, zodat je zeker weet dat de papieren kloppen voordat de dienst begint.\n\nBekijk onze website.","beeld":"beelden/20-papieren-op-orde.png"},{"id":"21-jouw-relatie-jouw-opdrachtgever","nr":21,"datum":"2026-11-30","tijd":"20:00","reeks":"risico","doelgroep":"zelfstandigen","onderwerp":"Rechtstreeks verder mag niet van het bureau","tekst":"Je werkt al jaren met dezelfde opdrachtgever, maar rechtstreeks verder gaan mag niet van het bureau waarmee je ooit binnenkwam. Zo'n relatiebeding of overnameregeling zorgt ervoor dat een tussenpartij aan jouw werk blijft verdienen, ook als jij en je opdrachtgever elkaar allang zelf hebben gevonden en precies weten wat ze aan elkaar hebben. Voor je ondernemerschap is dat een vreemde situatie, want de relatie die jij hebt opgebouwd, hoort bij jou als ondernemer. Op Zoriva ben je vindbaar voor opdrachtgevers, maak je zelf je afspraken en blijft elke relatie die ontstaat van jullie samen, zonder beding en zonder fee.\n\nBekijk onze website.","beeld":"beelden/21-jouw-relatie-jouw-opdrachtgever.png"},{"id":"22-onderwijs-in-cijfers","nr":22,"datum":"2026-12-01","tijd":"18:00","reeks":"gerust","doelgroep":"sector","onderwerp":"Het onderwijs laat zien dat het werkt","tekst":"Ruim 1.500 overeenkomsten en meer dan 225.000 uren per jaar lopen inmiddels rechtstreeks tussen scholen en zelfstandige onderwijsprofessionals, zonder dat er een bureau aan meeverdient. Dat model draait sinds 2018 bij Flexonderwijs en laat zien dat een hele sector haar flexibele schil zelf kan organiseren, met eerlijke tarieven, een dossier per opdracht en relaties die van de school en de professional blijven. Zoriva brengt diezelfde aanpak nu naar de zorg en andere sectoren, zodat je kunt instappen in een werkwijze die zich al jaren in de praktijk heeft bewezen en je niet hoeft te beginnen met een idee op papier.\n\nBekijk onze website.","beeld":"beelden/22-onderwijs-in-cijfers.png"},{"id":"23-ieder-voor-zich","nr":23,"datum":"2026-12-02","tijd":"08:00","reeks":"risico","doelgroep":"sector","onderwerp":"Ieder voor zich het wiel uitvinden","tekst":"Waarom zou elke zorgorganisatie in jouw regio het wiel opnieuw uitvinden? Wie op zichzelf een eigen pool van zelfstandigen opbouwt, doet hetzelfde werk als de organisatie verderop, met dezelfde vragen over opdrachten, documenten en de Wet DBA, en veel organisaties blijven daarom toch maar bij het bureau en betalen samen jaar na jaar een marge waar de zorg niet beter van wordt. Het slimst en het efficiëntst is om het samen te organiseren, met een gedeelde infrastructuur waarin iedere organisatie haar eigen opdrachten en regie houdt, terwijl de kennis, de werkwijze en het netwerk worden gedeeld, precies zoals het onderwijs al jaren laat zien.\n\nBekijk onze website.","beeld":"beelden/23-ieder-voor-zich.png"},{"id":"24-vinden-en-direct-geregeld","nr":24,"datum":"2026-12-03","tijd":"19:00","reeks":"gerust","doelgroep":"beide","onderwerp":"Elkaar vinden en het direct goed regelen","tekst":"Zoriva is de plek waar opdrachtgevers en zelfstandigen elkaar vinden en waar het meteen goed geregeld is, zonder een partij ertussen die belang heeft bij jouw uren. Als organisatie zet je een opdracht uit en zie je direct welke professionals beschikbaar zijn, met hun documenten op orde, en als zelfstandige reageer je op opdrachten die bij je passen en maak je zelf de afspraken. Het tarief komt tussen jullie tot stand, de uren en goedkeuringen worden vastgelegd en de factuur gaat rechtstreeks, zodat jullie allebei de zekerheid hebben die je zoekt, zonder afhankelijkheid en zonder commerciële strijkstok.\n\nBekijk onze website.","beeld":"beelden/24-vinden-en-direct-geregeld.png"},{"id":"25-hoeveel-bureaus","nr":25,"datum":"2026-12-04","tijd":"09:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Met hoeveel bureaus werk jij eigenlijk","tekst":"Met hoeveel bureaus, brokers en detacheerders werkt jouw organisatie op dit moment eigenlijk samen? Bij veel zorgorganisaties is dat in de loop der jaren gegroeid tot een lange lijst, met elk een eigen contract, een eigen portaal en een eigen marge, waardoor bijna niemand nog precies weet wat de flexibele schil in totaal kost. Nu de Wtta op 1 januari ingaat en iedere uitlener een toelating nodig heeft, is het verstandig om die lijst eens naast elkaar te leggen, want elke leverancier minder is ook een afhankelijkheid minder, zeker als je de zelfstandigen die je al kent rechtstreeks een opdracht kunt geven.\n\nBekijk onze website.","beeld":"beelden/25-hoeveel-bureaus.png"}];
const M=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const D=['zo','ma','di','wo','do','vr','za'];
const fmt=p=>{if(!p.datum)return 'zonder datum';const d=new Date(p.datum+'T12:00:00');return D[d.getDay()]+' '+d.getDate()+' '+M[d.getMonth()].slice(0,3)+' · '+p.tijd};
const sel=id=>document.getElementById(id);
[...new Set(POSTS.filter(p=>p.datum).map(p=>p.datum.slice(0,7)))].forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=M[+m.slice(5)-1]+' '+m.slice(0,4);sel('maand').append(o)});
function toon(){const m=sel('maand').value,r=sel('reeks').value,d=sel('doel').value;
 const lijst=POSTS.filter(p=>(!m||p.datum.startsWith(m))&&(!r||p.reeks===r)&&(!d||p.doelgroep===d));
 sel('teller').textContent=lijst.length+' van '+POSTS.length+' posts';
 sel('grid').innerHTML='';
 for(const p of lijst){const a=document.createElement('article');a.className='post';
  a.innerHTML='<img loading="lazy" alt=""><div class="meta"><span class="pil">'+(p.nr?'#'+p.nr+' · ':'')+fmt(p)+'</span><span class="pil r-'+p.reeks+'">'+p.reeks+'</span>'+(p.doelgroep?'<span class="pil">'+p.doelgroep+'</span>':'')+'</div><h2></h2><div class="tekst"></div><div class="knoppen"><button>Kopieer tekst</button><a class="knop" download>Beeld</a></div>';
  a.querySelector('img').src=p.beeld;a.querySelector('h2').textContent=p.onderwerp;a.querySelector('.tekst').textContent=p.tekst;
  const k=a.querySelector('a');k.href=p.beeld;k.setAttribute('download',p.id+'.png');
  const b=a.querySelector('button');b.onclick=async()=>{try{await navigator.clipboard.writeText(p.tekst);b.textContent='Gekopieerd'}catch(e){b.textContent='Kopiëren lukt niet'}setTimeout(()=>b.textContent='Kopieer tekst',1600)};
  sel('grid').append(a)}}
['maand','reeks','doel'].forEach(i=>sel(i).onchange=toon);toon();
</script></body></html>
