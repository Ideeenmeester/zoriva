<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoriva LinkedIn-planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--diep:#35123C;--paars:#63256C;--magenta:#9B4A9E;--accent:#E9A6F1;--lavendel:#F1ECF4;--pil:#EEE6F2;--rand:#E6DAEA}
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--lavendel);color:var(--diep)}
header{background:linear-gradient(115deg,var(--diep),#6A2873 70%,var(--magenta));color:#fff;padding:36px 16px 30px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header img{height:44px;background:#fff;padding:6px 12px;border-radius:10px}
h1{font-size:clamp(26px,4vw,40px);letter-spacing:-.02em;margin-top:18px}
header p{opacity:.85;margin-top:6px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 6px}
select{font:inherit;font-size:15px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--rand);background:#fff;color:var(--paars)}
.teller{font-size:14px;color:#6B5672;margin:6px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;padding-bottom:60px}
.post{background:#fff;border:1.5px solid var(--rand);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.post img{width:100%;display:block;aspect-ratio:1200/627;object-fit:cover;background:var(--pil)}
.meta{display:flex;flex-wrap:wrap;gap:8px;padding:16px 18px 0;font-size:13px}
.pil{background:var(--pil);color:var(--paars);padding:4px 12px;border-radius:999px}
.pil.r-risico{background:var(--diep);color:#fff}.pil.r-advertentie{background:var(--magenta);color:#fff}
h2{font-size:18px;padding:10px 18px 0;letter-spacing:-.01em}
.tekst{white-space:pre-wrap;font-size:14px;line-height:1.55;color:#4A3A50;padding:10px 18px;flex:1}
.knoppen{display:flex;gap:8px;padding:0 18px 18px}
button,a.knop{font:inherit;font-size:14px;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;text-decoration:none}
button{background:var(--paars);color:#fff}a.knop{background:var(--pil);color:var(--paars)}
@media(max-width:400px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap"><img src="logo.png" alt="Zoriva"><h1>LinkedIn-planning</h1><p>Alle posts met beeld, datum en tijd (Europe/Amsterdam). Bijgewerkt 29 oktober 2026 om 23:17.</p></div></header>
<main class="wrap">
<div class="filters"><select id="maand"><option value="">Alle maanden</option></select>
<select id="reeks"><option value="">Alle reeksen</option><option value="risico">Risico (ma-wo-vr)</option><option value="gerust">Geruststellend (di-do)</option><option value="advertentie">Advertenties</option></select>
<select id="doel"><option value="">Alle doelgroepen</option><option value="opdrachtgevers">Opdrachtgevers</option><option value="zelfstandigen">Zelfstandigen</option><option value="sector">Sector</option><option value="beide">Beide</option></select></div>
<div class="teller" id="teller"></div><div class="grid" id="grid"></div></main>
<script>
const POSTS=[{"id":"01-andermans-systeem","nr":1,"datum":"2026-11-02","tijd":"14:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Je flexwerkers in andermans systeem","tekst":"Waar staan de contracten, uren en facturen van iedereen die flexibel voor jouw organisatie werkt? Bij veel organisaties is het eerlijke antwoord dat ze verspreid liggen over de portalen van verschillende bureaus en brokers, waardoor je voor elk overzicht afhankelijk bent van een commerciële partij die er zelf belang bij heeft dat je blijft. Zolang die gegevens niet van jou zijn, is de regie dat eigenlijk ook niet. Met Zoriva breng je je flexibele schil onder in een eigen omgeving, met de contracten, de urenregistratie en de facturatie op één plek, zodat je zelf ziet wie er voor je werkt en op welke afspraken.\n\nBekijk onze website.","beeld":"beelden/01-andermans-systeem.png"},{"id":"02-alles-in-eigen-beheer","nr":2,"datum":"2026-11-03","tijd":"19:00","reeks":"gerust","doelgroep":"opdrachtgevers","onderwerp":"Contracten, uren en facturen in eigen beheer","tekst":"Stel je voor dat je de contracten, de urenregistratie en de facturatie van je hele flexibele schil gewoon zelf in beheer hebt, in je eigen omgeving en zonder dat een commerciële partij ertussen zit. Dat is precies wat Zoriva doet: je legt per opdracht vast wat er is afgesproken, de uren worden geregistreerd en door jou goedgekeurd, en de professional factureert rechtstreeks op basis van die afspraak. Alles blijft bewaard in één dossier, zodat je op elk moment kunt laten zien hoe een samenwerking is verlopen en je niet meer afhankelijk bent van de administratie van een ander.\n\nBekijk onze website.","beeld":"beelden/02-alles-in-eigen-beheer.png"},{"id":"03-vijf-portalen","nr":3,"datum":"2026-11-04","tijd":"15:00","reeks":"risico","doelgroep":"zelfstandigen","onderwerp":"Elke opdrachtgever een ander portaal","tekst":"Vijf opdrachtgevers betekent voor veel zelfstandigen vijf portalen, vijf manieren om uren door te geven en vijf keer wachten tot een tussenpartij je factuur heeft doorgezet. Het kost je avonden die je liever aan je vak of je eigen bedrijf besteedt, en ondertussen heb je zelf nauwelijks overzicht van wat er is goedgekeurd en wat er nog openstaat. Op Zoriva staan je opdrachten, je uren en je facturen bij elkaar, terwijl je rechtstreeks met je opdrachtgever werkt en zelf factureert, zodat je administratie weer bij jou ligt en je precies weet waar je staat.\n\nBekijk onze website.","beeld":"beelden/03-vijf-portalen.png"},{"id":"04-jij-houdt-alles","nr":4,"datum":"2026-11-05","tijd":"20:00","reeks":"gerust","doelgroep":"zelfstandigen","onderwerp":"Jij onderhandelt, jij factureert, jij houdt alles","tekst":"Jij onderhandelt, jij factureert en jij houdt alles wat je verdient, en zo hoort zelfstandig werken eigenlijk ook te voelen. Op Zoriva maak je rechtstreeks afspraken met de opdrachtgever over tarief, periode en werkwijze, en stuur je zelf de factuur voor precies het bedrag dat jullie hebben afgesproken, omdat er geen bemiddelaar is die een percentage van je uren vraagt. Je opdrachten, uren en facturen staan op één plek, terwijl je opdrachtgever tegelijk een helder overzicht heeft, zodat jullie allebei zien dat de samenwerking goed geregeld is en jij je eigen ondernemer blijft.\n\nBekijk onze website.","beeld":"beelden/04-jij-houdt-alles.png"},{"id":"05-wie-werkt-er-vandaag","nr":5,"datum":"2026-11-06","tijd":"16:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Wie werkt er vandaag eigenlijk voor je","tekst":"Kun jij binnen een minuut zeggen hoeveel flexibele krachten er vandaag voor jouw organisatie aan het werk zijn, en via welke route? De meeste organisaties kunnen dat niet, omdat de oproepkrachten in een spreadsheet staan, de zelfstandigen per afdeling zijn geregeld en de rest via een handvol leveranciers binnenkomt. Juist dat gebrek aan overzicht maakt het lastig om bij te sturen op kosten, kwaliteit en continuïteit. Zoriva geeft je één overzicht van iedereen in je interne en externe schil, met de lopende afspraken, de gewerkte uren en de documenten die bijna verlopen, zodat je weer stuurt op feiten in plaats van op losse lijstjes.\n\nBekijk onze website.","beeld":"beelden/05-wie-werkt-er-vandaag.png"},{"id":"06-wat-je-niet-meer-betaalt","nr":6,"datum":"2026-11-09","tijd":"17:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Wat je niet meer hoeft te betalen","tekst":"Een opslag van een paar euro per uur lijkt weinig, totdat je hem vermenigvuldigt met alle uren die flexibele krachten in een jaar bij jouw organisatie maken. Je betaalt dan structureel voor een schakel die het werk zelf niet beter maakt, vaak zelfs voor mensen die je al jaren kent en die je net zo goed zelf had kunnen vragen. Met Zoriva spreek je het tarief rechtstreeks af met de professional, die precies factureert wat jullie samen hebben afgesproken, terwijl je zelf alleen een vaste prijs voor de software betaalt die niet meegroeit met de uren, zonder fee per plaatsing en zonder overnamekosten.\n\nBekijk onze website.","beeld":"beelden/06-wat-je-niet-meer-betaalt.png"},{"id":"07-onderwijs-sinds-2018","nr":7,"datum":"2026-11-10","tijd":"08:00","reeks":"gerust","doelgroep":"sector","onderwerp":"In het onderwijs is het al gelukt","tekst":"Wat in veel sectoren nog nieuw klinkt, doen scholen en zelfstandige onderwijsprofessionals al sinds 2018, want bij Flexonderwijs werken zij rechtstreeks met elkaar samen zonder partij die aan elk uur verdient. Wat daar in bijna negen jaar is geleerd over het afbakenen van opdrachten, het bijhouden van uren en het eerlijk tot stand komen van tarieven, vormt nu de basis van Zoriva. Zo kunnen ook de zorg, de kinderopvang, overheden en andere sectoren hun eigen flexibele schil in eigen beheer nemen, met een werkwijze die zich in de praktijk al heeft bewezen.\n\nBekijk onze website.","beeld":"beelden/07-onderwijs-sinds-2018.png"},{"id":"08-wie-bepaalt-jouw-tarief","nr":8,"datum":"2026-11-11","tijd":"18:00","reeks":"risico","doelgroep":"zelfstandigen","onderwerp":"Een tarief dat een ander bepaalt","tekst":"Laat jij je uurtarief nog door een tussenpartij bepalen? In veel constructies legt een bureau of broker vooraf vast wat je per uur krijgt, wat er bovenop gaat en hoe lang de opdracht loopt, terwijl jij als ondernemer juist zelf over die dingen hoort te beslissen. Je levert daarmee niet alleen een deel van je inkomen in, maar ook een stuk van je autonomie, en je weet vaak niet eens wat je opdrachtgever uiteindelijk voor jou betaalt. Bij Zoriva komt het tarief rechtstreeks tot stand tussen jou en je opdrachtgever, zonder tarieftabellen en zonder minimum of maximum, zodat de afspraak ook echt van jullie samen is.\n\nBekijk onze website.","beeld":"beelden/08-wie-bepaalt-jouw-tarief.png"},{"id":"09-interne-en-externe-schil","nr":9,"datum":"2026-11-12","tijd":"09:00","reeks":"gerust","doelgroep":"opdrachtgevers","onderwerp":"Interne en externe schil in één overzicht","tekst":"Je eigen invallers, oproepkrachten en oud-medewerkers horen net zo goed bij je flexibele schil als de zelfstandigen die je van buiten haalt, en het werkt het prettigst als je ze ook zo kunt beheren. In Zoriva breng je de interne en de externe schil samen, met voor iedereen een profiel, afspraken die per opdracht worden vastgelegd en uren en facturen die op dezelfde manier lopen. Je ziet in één oogopslag wie er beschikbaar is, wie al bekend is met jouw organisatie en waar je echt iemand nieuw nodig hebt, zodat je eerst kijkt naar je eigen mensen voordat je verder zoekt.\n\nBekijk onze website.","beeld":"beelden/09-interne-en-externe-schil.png"},{"id":"10-twee-schillen-twee-werelden","nr":10,"datum":"2026-11-13","tijd":"19:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Interne en externe schil in twee werelden","tekst":"Je eigen oproepkrachten en invallers beheer je in een spreadsheet, terwijl je externe krachten via een bureau binnenkomen en in het systeem van die leverancier staan. Zo ontstaan er twee werelden die niet met elkaar praten, met dubbel werk voor planning en administratie en zonder één plek waar je ziet wat je flexibele capaciteit je in totaal kost. Met Zoriva kun je de interne en de externe schil in hetzelfde systeem onderbrengen, met contracten, urenregistratie en facturatie op één manier geregeld, zodat je per afdeling ziet wie er beschikbaar is en waar je echt iemand van buiten nodig hebt.\n\nBekijk onze website.","beeld":"beelden/10-twee-schillen-twee-werelden.png"},{"id":"11-van-wie-is-jouw-netwerk","nr":11,"datum":"2026-11-16","tijd":"20:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Van wie is het netwerk dat voor je werkt","tekst":"Hoeveel van de professionals die bij jou werken, ken je eigenlijk alleen via de partij die hen levert? Veel organisaties ontdekken pas als ze willen overstappen hoe afhankelijk ze zijn geworden, omdat de contactgegevens, de afspraken en soms zelfs de planning bij een ander liggen, terwijl het jouw organisatie is die op deze mensen draait. Met Zoriva begin je juist bij wie je al kent, je nodigt de zelfstandigen en flexkrachten uit met wie je nu al samenwerkt en bouwt zo een eigen netwerk op dat bij jou blijft, wie er ook een opdracht uitvoert en hoe lang die samenwerking ook duurt.\n\nBekijk onze website.","beeld":"beelden/11-van-wie-is-jouw-netwerk.png"},{"id":"12-een-plek-voor-alles","nr":12,"datum":"2026-11-17","tijd":"10:00","reeks":"gerust","doelgroep":"zelfstandigen","onderwerp":"Eén plek voor al je opdrachten","tekst":"Wat zou het schelen als al je opdrachten, uren en facturen op één plek stonden, ongeacht voor welke opdrachtgever je werkt? Op Zoriva houd je je uren bij per opdracht, zie je direct wat je opdrachtgever heeft goedgekeurd en maak je je factuur op basis van precies het tarief dat jullie samen hebben afgesproken. Je documenten, zoals je verzekeringen en je KvK-inschrijving, staan er ook, met een seintje als iets bijna verloopt. Zo houd je zelf het overzicht over je onderneming, terwijl je opdrachtgever ziet dat alles klopt en jullie rechtstreeks blijven samenwerken.\n\nBekijk onze website.","beeld":"beelden/12-een-plek-voor-alles.png"},{"id":"13-jouw-relatie-jouw-opdrachtgever","nr":13,"datum":"2026-11-18","tijd":"08:00","reeks":"risico","doelgroep":"zelfstandigen","onderwerp":"Rechtstreeks verder mag niet van het bureau","tekst":"Je werkt al jaren met dezelfde opdrachtgever, maar rechtstreeks verder gaan mag niet van het bureau waarmee je ooit binnenkwam. Zo'n relatiebeding of overnameregeling zorgt ervoor dat een tussenpartij aan jouw werk blijft verdienen, ook als jij en je opdrachtgever elkaar allang zelf hebben gevonden en precies weten wat ze aan elkaar hebben. Voor je ondernemerschap is dat een vreemde situatie, want de relatie die jij hebt opgebouwd, hoort bij jou. Op Zoriva ben je vindbaar voor opdrachtgevers, maak je zelf je afspraken en blijft elke relatie die ontstaat van jullie samen, zonder beding en zonder fee.\n\nBekijk onze website.","beeld":"beelden/13-jouw-relatie-jouw-opdrachtgever.png"},{"id":"14-nul-euro-marge","nr":14,"datum":"2026-11-19","tijd":"11:00","reeks":"gerust","doelgroep":"opdrachtgevers","onderwerp":"Wat de professional factureert, betaal jij","tekst":"Het bedrag op de factuur van de professional is bij Zoriva precies het bedrag dat jij betaalt, omdat er niemand tussen zit die per gewerkt uur een opslag rekent. Jij en de professional spreken samen het tarief, de periode en de werkwijze af, de professional factureert dat tarief rechtstreeks aan jou en voor de software betaal je een vaste prijs die niet meegroeit met elk extra uur. Zo blijft het geld dat bedoeld is voor het werk ook echt bij de mensen die dat werk doen, en weet je als organisatie vooraf waar je aan toe bent zonder afhankelijk te zijn van een partij die belang heeft bij meer uren.\n\nBekijk onze website.","beeld":"beelden/14-nul-euro-marge.png"},{"id":"15-klopt-elke-factuur","nr":15,"datum":"2026-11-20","tijd":"09:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Klopt elke factuur eigenlijk wel","tekst":"Elke maand komen er facturen binnen van bureaus, brokers en losse zelfstandigen, elk in een eigen vorm en op basis van uren die ergens anders zijn bijgehouden. Wie controleert dan eigenlijk of de gefactureerde uren overeenkomen met wat er is afgesproken en gewerkt? In de praktijk is dat vaak niemand, simpelweg omdat de gegevens nergens naast elkaar staan. In Zoriva worden de uren geregistreerd en door jou goedgekeurd voordat er gefactureerd wordt, zodat de afspraak, de uren en de factuur zichtbaar bij elkaar horen en je achteraf niets hoeft uit te zoeken.\n\nBekijk onze website.","beeld":"beelden/15-klopt-elke-factuur.png"},{"id":"16-betalen-voor-je-eigen-relatie","nr":16,"datum":"2026-11-23","tijd":"10:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Overnamekosten voor je eigen relatie","tekst":"Je beste flexkracht wil bij je in dienst komen, en dan stuurt het bureau een rekening. Het is een van de minder zichtbare kosten van werken via een tussenpartij, omdat je die pas tegenkomt op het moment dat een samenwerking juist heel goed loopt, en je betaalt dan voor een relatie die je zelf hebt opgebouwd met iemand die jouw team en jouw werkwijze allang kent. Bij Zoriva bestaat zo'n overnamefee niet, ook niet bij indiensttreding, omdat de relatie vanaf de eerste dag van jullie samen is en wij alleen de software leveren waarmee je die samenwerking organiseert.\n\nBekijk onze website.","beeld":"beelden/16-betalen-voor-je-eigen-relatie.png"},{"id":"17-samen-organiseren","nr":17,"datum":"2026-11-24","tijd":"12:00","reeks":"gerust","doelgroep":"sector","onderwerp":"Samen organiseren is slimmer dan alleen","tekst":"Je kunt de tussenpartij er als organisatie prima zelf uit halen, maar het wordt pas echt slim als je dat samen doet met andere organisaties in je regio of je sector. Door één gezamenlijke pool op te bouwen, delen jullie een netwerk van professionals die jullie werkwijze al kennen, terwijl elke organisatie haar eigen opdrachten, contracten en uren beheert en elke zelfstandige zelf blijft kiezen waar hij aan de slag gaat. Zo hoeft niemand ieder voor zich het wiel opnieuw uit te vinden, houden jullie samen het overzicht en blijft het geld dat anders als marge zou verdwijnen gewoon in de sector.\n\nBekijk onze website.","beeld":"beelden/17-samen-organiseren.png"},{"id":"18-hoeveel-partijen","nr":18,"datum":"2026-11-25","tijd":"11:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Met hoeveel partijen werk je eigenlijk","tekst":"Met hoeveel bureaus, brokers en detacheerders werkt jouw organisatie op dit moment samen? Bij veel organisaties is dat in de loop der jaren gegroeid tot een lange lijst, met elk een eigen contract, een eigen portaal en een eigen marge, waardoor bijna niemand nog precies weet wat de flexibele schil in totaal kost of wie welke afspraken heeft gemaakt. Het loont om die lijst eens naast elkaar te leggen, want elke leverancier minder is ook een afhankelijkheid minder, zeker als je de professionals die je al kent rechtstreeks een opdracht kunt geven en alles in je eigen systeem bijhoudt.\n\nBekijk onze website.","beeld":"beelden/18-hoeveel-partijen.png"},{"id":"19-begin-bij-wie-je-kent","nr":19,"datum":"2026-11-26","tijd":"13:00","reeks":"gerust","doelgroep":"opdrachtgevers","onderwerp":"Begin bij wie je al kent","tekst":"Overstappen naar een flexibele schil in eigen beheer klinkt als een groot project, maar de eerste stap is verrassend klein, omdat je begint bij de mensen die je al kent. Je nodigt je eigen invallers en zelfstandigen uit in je omgeving, zij maken een profiel aan met hun documenten, en vanaf dat moment kun je opdrachten uitzetten met een heldere omschrijving, periode en voorwaarden. Daarna lopen contracten, uren en facturen via één proces, zodat je stap voor stap minder afhankelijk wordt van commerciële partijen zonder dat het werk er last van heeft.\n\nBekijk onze website.","beeld":"beelden/19-begin-bij-wie-je-kent.png"},{"id":"20-ieder-voor-zich","nr":20,"datum":"2026-11-27","tijd":"12:00","reeks":"risico","doelgroep":"sector","onderwerp":"Ieder voor zich het wiel uitvinden","tekst":"Waarom zou elke school, zorgaanbieder, kinderopvang of gemeente in jouw regio het wiel opnieuw uitvinden? Wie op zichzelf een eigen pool van flexibele krachten opbouwt, doet hetzelfde werk als de organisatie verderop, met dezelfde vragen over contracten, uren en facturen, en veel organisaties blijven daarom toch maar bij een commerciële partij en betalen jaar na jaar een marge waar niemand beter van wordt. Slimmer is het om het samen te organiseren, met een gedeelde infrastructuur waarin iedere organisatie haar eigen opdrachten en regie houdt, terwijl de kennis, de werkwijze en het netwerk worden gedeeld.\n\nBekijk onze website.","beeld":"beelden/20-ieder-voor-zich.png"},{"id":"21-alleen-via-bureau","nr":21,"datum":"2026-11-30","tijd":"13:00","reeks":"risico","doelgroep":"zelfstandigen","onderwerp":"Alleen nog via een bureau mogen werken","tekst":"Hoor jij ook steeds vaker dat je alleen nog via een bureau aan de slag mag? Veel opdrachtgevers kiezen uit onzekerheid voor een tussenpartij, waardoor jij een deel van je tarief inlevert aan iemand die het werk niet doet en vaak ook de vrijheid kwijtraakt om zelf afspraken te maken. Wat een opdrachtgever werkelijk rust geeft, is overzicht: een helder afgebakende opdracht, documenten die op orde zijn en uren die netjes worden vastgelegd. Dat kun je ook rechtstreeks bieden, en op Zoriva staat het allemaal op één plek, zodat jullie allebei zien dat het goed geregeld is zonder dat iemand aan jouw uren verdient.\n\nBekijk onze website.","beeld":"beelden/21-alleen-via-bureau.png"},{"id":"22-onderwijs-in-cijfers","nr":22,"datum":"2026-12-01","tijd":"14:00","reeks":"gerust","doelgroep":"sector","onderwerp":"Het onderwijs laat zien dat het werkt","tekst":"Ruim 1.500 overeenkomsten en meer dan 225.000 uren per jaar lopen inmiddels rechtstreeks tussen scholen en zelfstandige onderwijsprofessionals, zonder dat er een commerciële partij aan meeverdient. Dat model draait sinds 2018 bij Flexonderwijs en laat zien dat een hele sector haar flexibele schil zelf kan organiseren, met eerlijke tarieven, uren en facturen op één plek en relaties die van de school en de professional blijven. Zoriva brengt diezelfde aanpak nu naar andere sectoren, zodat je kunt instappen in een werkwijze die zich al jaren heeft bewezen en niet hoeft te beginnen met een idee op papier.\n\nBekijk onze website.","beeld":"beelden/22-onderwijs-in-cijfers.png"},{"id":"23-papieren-op-orde","nr":23,"datum":"2026-12-02","tijd":"14:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Documenten die ongemerkt verlopen","tekst":"Een verlopen verzekering, VOG of certificaat ontdek je liever niet pas nadat iemand al een paar weken voor je aan het werk is. Toch gebeurt dat sneller dan je denkt als de documenten van flexibele krachten verspreid staan over mailboxen, portalen van leveranciers en losse mappen, en niemand precies weet wanneer iets afloopt. In Zoriva staan de KvK-inschrijving, verzekeringen, diploma's en certificaten per persoon vast, met een vervaldatum waar die er is, en wat dreigt te verlopen valt op voordat iemand wordt ingezet, zodat je zeker weet dat alles klopt voordat de opdracht begint.\n\nBekijk onze website.","beeld":"beelden/23-papieren-op-orde.png"},{"id":"24-vinden-en-direct-geregeld","nr":24,"datum":"2026-12-03","tijd":"15:00","reeks":"gerust","doelgroep":"beide","onderwerp":"Elkaar vinden en het direct goed regelen","tekst":"Zoriva is de plek waar opdrachtgevers en zelfstandigen elkaar vinden en waar het meteen goed geregeld is, zonder een partij ertussen die belang heeft bij jouw uren. Als organisatie zet je een opdracht uit en zie je direct welke professionals beschikbaar zijn, met hun documenten op orde, en als zelfstandige reageer je op opdrachten die bij je passen en maak je zelf de afspraken. Het tarief komt tussen jullie tot stand, de uren en goedkeuringen worden vastgelegd en de factuur gaat rechtstreeks, zodat jullie allebei regie en overzicht houden, zonder afhankelijkheid en zonder commerciële strijkstok.\n\nBekijk onze website.","beeld":"beelden/24-vinden-en-direct-geregeld.png"},{"id":"25-kosten-die-meegroeien","nr":25,"datum":"2026-12-04","tijd":"15:00","reeks":"risico","doelgroep":"opdrachtgevers","onderwerp":"Kosten die meegroeien met elk uur","tekst":"Elk extra uur dat een flexibele kracht voor je werkt, levert de partij ertussen ook een extra uur marge op. Dat lijkt logisch, maar het betekent dat je kosten meegroeien op precies de momenten dat je het hardst mensen nodig hebt, en dat de leverancier er belang bij heeft dat jij afhankelijk blijft. Met Zoriva draai je dat om, want je betaalt een vaste prijs voor de software, terwijl het tarief rechtstreeks tussen jou en de professional wordt afgesproken en gefactureerd. Zo wordt je flexibele schil een voorspelbare post op de begroting die je zelf in de hand houdt.\n\nBekijk onze website.","beeld":"beelden/25-kosten-die-meegroeien.png"},{"id":"advertentie-1-eigen-systeem","nr":null,"datum":"","tijd":"","reeks":"advertentie","doelgroep":"opdrachtgevers","onderwerp":"Jouw flexibele schil in je eigen systeem","tekst":"Wat als je de contracten, uren en facturen van iedereen die flexibel voor je werkt gewoon in je eigen omgeving had, in plaats van verspreid over de portalen van bureaus en brokers? Met Zoriva beheer je je interne en externe schil op één plek, betaal je geen marge per gewerkt uur en blijft elke relatie die je opbouwt van jou.\n\nBekijk onze website.","beeld":"beelden/advertentie-1-eigen-systeem.png"},{"id":"advertentie-2-nul-marge-per-uur","nr":null,"datum":"","tijd":"","reeks":"advertentie","doelgroep":"opdrachtgevers","onderwerp":"Geen cent marge per gewerkt uur","tekst":"Elke euro die je aan flexibele inzet uitgeeft, hoort bij de mensen die het werk doen en niet bij een partij ertussen. Bij Zoriva spreek je het tarief rechtstreeks af met de professional, betaal je precies wat hij factureert en reken je voor de software een vaste prijs die niet meegroeit met de uren.\n\nBekijk onze website.","beeld":"beelden/advertentie-2-nul-marge-per-uur.png"},{"id":"advertentie-3-heel-je-tarief","nr":null,"datum":"","tijd":"","reeks":"advertentie","doelgroep":"zelfstandigen","onderwerp":"Als zelfstandige houd je je hele tarief","tekst":"Jij doet het werk, dus jij houdt ook wat je verdient. Op Zoriva maak je als zelfstandige rechtstreeks afspraken met je opdrachtgever, factureer je zelf precies het tarief dat jullie samen hebben afgesproken en heb je je opdrachten, uren en facturen op één plek, terwijl je opdrachtgever ziet dat alles goed geregeld is.\n\nBekijk onze website.","beeld":"beelden/advertentie-3-heel-je-tarief.png"},{"id":"advertentie-4-rechtstreeks-zonder-strijkstok","nr":null,"datum":"","tijd":"","reeks":"advertentie","doelgroep":"beide","onderwerp":"Rechtstreeks en zonder strijkstok","tekst":"Opdrachtgevers en zelfstandigen vinden elkaar op Zoriva en regelen het daar meteen goed, met een heldere opdracht, uren die worden vastgelegd en een factuur die rechtstreeks gaat. Er zit niemand tussen die verdient aan elk uur, zodat jullie allebei de regie houden en de samenwerking echt van jullie samen blijft.\n\nBekijk onze website.","beeld":"beelden/advertentie-4-rechtstreeks-zonder-strijkstok.png"},{"id":"advertentie-5-minder-partijen-meer-regie","nr":null,"datum":"","tijd":"","reeks":"advertentie","doelgroep":"opdrachtgevers","onderwerp":"Minder partijen en meer regie","tekst":"Elke leverancier in je flexibele schil brengt een eigen portaal, een eigen contract en een eigen marge mee, en samen maken ze je afhankelijker dan je zou willen. Met Zoriva breng je alles terug naar één eigen systeem voor contracten, urenregistratie en facturatie, zodat je weer zelf bepaalt met wie je werkt en op welke voorwaarden.\n\nBekijk onze website.","beeld":"beelden/advertentie-5-minder-partijen-meer-regie.png"},{"id":"advertentie-6-klaar-voor-jouw-sector","nr":null,"datum":"","tijd":"","reeks":"advertentie","doelgroep":"sector","onderwerp":"Bewezen in het onderwijs, klaar voor jouw sector","tekst":"Scholen en zelfstandige onderwijsprofessionals werken al sinds 2018 rechtstreeks met elkaar samen, zonder dat een commerciële partij aan elk uur verdient. Zoriva brengt die bewezen aanpak nu naar de zorg, de kinderopvang, overheden en elke andere sector die haar flexibele schil liever in eigen beheer heeft en het samen wil organiseren.\n\nBekijk onze website.","beeld":"beelden/advertentie-6-klaar-voor-jouw-sector.png"}];
const M=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const D=['zo','ma','di','wo','do','vr','za'];
const fmt=p=>{if(!p.datum)return 'zonder datum';const d=new Date(p.datum+'T12:00:00');return D[d.getDay()]+' '+d.getDate()+' '+M[d.getMonth()].slice(0,3)+' · '+p.tijd};
const sel=id=>document.getElementById(id);
[...new Set(POSTS.filter(p=>p.datum).map(p=>p.datum.slice(0,7)))].forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=M[+m.slice(5)-1]+' '+m.slice(0,4);sel('maand').append(o)});
function toon(){const m=sel('maand').value,r=sel('reeks').value,d=sel('doel').value;
 const lijst=POSTS.filter(p=>(!m||p.datum.startsWith(m))&&(!r||p.reeks===r)&&(!d||p.doelgroep===d));
 sel('teller').textContent=lijst.length+' van '+POSTS.length+' posts';
 sel('grid').innerHTML='';
 for(const p of lijst){const a=document.createElement('article');a.className='post';
  a.innerHTML='<img loading="lazy" alt=""><div class="meta"><span class="pil">'+(p.nr?'#'+p.nr+' · ':'')+fmt(p)+'</span><span class="pil r-'+p.reeks+'">'+p.reeks+'</span>'+(p.doelgroep?'<span class="pil">'+p.doelgroep+'</span>':'')+'</div><h2></h2><div class="tekst"></div><div class="knoppen"><button>Kopieer tekst</button><a class="knop" download>Beeld</a></div>';
  a.querySelector('img').src=p.beeld;a.querySelector('h2').textContent=p.onderwerp;a.querySelector('.tekst').textContent=p.tekst;
  const k=a.querySelector('a');k.href=p.beeld;k.setAttribute('download',p.id+'.png');
  const b=a.querySelector('button');b.onclick=async()=>{try{await navigator.clipboard.writeText(p.tekst);b.textContent='Gekopieerd'}catch(e){b.textContent='Kopiëren lukt niet'}setTimeout(()=>b.textContent='Kopieer tekst',1600)};
  sel('grid').append(a)}}
['maand','reeks','doel'].forEach(i=>sel(i).onchange=toon);toon();
</script></body></html>
