# Optioneel: stuurt de Metricool-planning naar n8n, zodat ingeplande posts ook in je eigen systemen landen.
# Zet eerst het geheim N8N_WEBHOOK_URL (Settings > Secrets and variables > Actions). Zonder geheim doet dit niets.
name: Planning naar n8n
on:
  workflow_dispatch:
    inputs:
      vanaf: { description: 'Alleen posts vanaf deze datum (JJJJ-MM-DD), leeg = alles', required: false }
jobs:
  stuur:
    runs-on: ubuntu-latest
    env: { N8N_WEBHOOK_URL: '${{ secrets.N8N_WEBHOOK_URL }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run metricool -- --vanaf "${{ inputs.vanaf }}"
      - run: node scripts/n8n.js
